<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cine-Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/cinespace.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html">🎬 Cine-Space</a>
            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-dark" href="index.html">Home</a>
                <a class="btn btn-dark" href="account.html">My Watchlist</a>
                <a class="btn btn-dark" href="login.html" data-auth="out">Log in</a>
                <button class="btn btn-dark" onclick="logout()" data-auth="in">Log out</button>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <button class="btn btn-outline-secondary mb-3" onclick="goBack()">&larr; Back</button>
        <div id="message"></div>
        <div id="detail"></div>

        <h3 class="h4 mt-5 mb-3">Similar titles</h3>
        <div id="similar" class="poster-grid"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        // not called "id": inside an inline onclick, "id" would mean the button's own id attribute
        const titleSource = params.get('source');
        const titleId = params.get('id');

        function goBack() {
            if (history.length > 1) history.back();
            else location.href = 'index.html';
        }

        // add button state lives here, so redrawing the details never loses it
        let adding = false, added = false;
        function refreshAddButton() {
            const b = document.getElementById('addBtn');
            if (!b) return;
            b.disabled = adding || added;
            b.textContent = added ? '✓ On your watchlist' : adding ? 'Adding…' : '+ Add to watchlist';
        }
        async function onAdd() {
            if (adding || added) return;
            adding = true; refreshAddButton();
            const result = await addToWatchlist(titleSource, titleId);
            adding = false; added = result !== 'error';
            refreshAddButton();
        }

        function watchLinks(links) {
            if (!links.length) return '<p class="text-muted">No links yet.</p>';
            return `<div class="watch-links">${links.map(l => `
                <a class="watch-chip${l.price === 'Search' ? ' is-search' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
                    ${esc(l.name)}<small>${esc(l.price || '')}</small></a>`).join('')}</div>
                <p class="text-muted small mt-2">Availability depends on your country. "Search" links open that service's own search page.</p>`;
        }

        function renderDetail(t) {
            detail.innerHTML = `
                <div class="d-flex gap-4 flex-wrap">
                ${t.posterUrl ? `<img src="${esc(t.posterUrl)}" width="200" class="rounded shadow-sm align-self-start" alt="">` : ''}
                <div style="flex:1;min-width:260px">
                <h1>${esc(t.title)}</h1>
                <p>Type: ${esc(t.type)} | Age rating: ${esc(t.ageRating ?? 'n/a')} | Score: ${esc(t.score ?? 'n/a')}</p>
                <p>${t.type === 'movie' ? `Length: ${esc(t.lengthMinutes ?? 'n/a')} minutes` : `Episodes: ${esc(t.episodes ?? 'n/a')}`}</p>
                <p>By: ${esc((t.creators || []).join(', ') || 'n/a')}</p>
                <p>${esc(t.synopsis)}</p>
                <button id="addBtn" class="btn btn-primary mb-3" type="button">+ Add to watchlist</button>
                <h3 class="h5">Where to watch</h3>
                ${watchLinks(t.watchLinks || [])}</div></div>`;
            document.getElementById('addBtn').addEventListener('click', onAdd);
            refreshAddButton();
        }

        // Two steps so the page appears at once:
        // 1) ?cached=1 answers immediately from the saved catalog copy (or details fetched earlier)
        // 2) the live online details then replace it (age rating, streaming links...)
        async function loadTitle() {
            detail.innerHTML = '<div class="d-flex gap-4 flex-wrap"><div class="skeleton" style="width:200px;height:300px;border-radius:12px"></div>'
                + '<div style="flex:1;min-width:260px"><div class="skeleton" style="height:40px;width:60%;margin-bottom:16px"></div>'
                + '<div class="skeleton" style="height:16px;margin-bottom:10px"></div><div class="skeleton" style="height:16px;width:80%;margin-bottom:10px"></div>'
                + '<div class="skeleton" style="height:16px;width:70%"></div></div></div>';
            loadSimilar();                                         // runs at the same time, it only reads the saved catalog

            let drawn = false;
            try {
                const quick = await api(`/api/catalog/${titleSource}/${titleId}?cached=1`);
                if (quick.data) { renderDetail(quick.data); drawn = true; }
                if (quick.fresh) return;                           // that was already live data
            } catch (e) { /* not saved yet: wait for the live answer */ }

            try {
                renderDetail((await api(`/api/catalog/${titleSource}/${titleId}`)).data);
            } catch (e) {
                if (!drawn) detail.innerHTML = '';
                showMessage(e.message);
            }
        }

        async function loadSimilar() {
            try {
                const s = (await api(`/api/catalog/${titleSource}/${titleId}/similar`)).data;
                similar.innerHTML = s.map(posterCard).join('') || 'None found.';
            } catch (e) {
                similar.innerHTML = '';
            }
        }

        loadTitle();
    </script>
</body>
</html>
