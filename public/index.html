<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cine-Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-semibold">Cine-Space</span>
            <div class="d-flex gap-2">
                <a class="btn btn-dark" href="account.html">My Watchlist</a>
                <a class="btn btn-dark" href="login.html">Log in</a>
                <button class="btn btn-dark" onclick="logout()">Log out</button>
                <button class="btn btn-dark" onclick="syncCatalog()">Sync Catalog</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="mb-4">
            <h2 class="h3 fw-semibold mb-1">Browse Titles</h2>
            <p class="text-muted mb-0">Movies, series and anime synced from free online APIs.</p>
        </div>

        <div id="message"></div>

        <!-- ===== SUMMARY CARDS (count the titles currently shown) ===== -->
        <div class="row g-3 mb-4">
            <div class="col-md">
                <div class="card h-100 border-0 border-start border-4 border-primary shadow-sm">
                    <div class="card-body"><small class="text-muted">Titles shown</small><h3 id="cTotal" class="fw-semibold mb-0">0</h3></div>
                </div>
            </div>
            <div class="col-md">
                <div class="card h-100 border-0 border-start border-4 border-success shadow-sm">
                    <div class="card-body"><small class="text-muted">Movies</small><h3 id="cMovie" class="fw-semibold mb-0">0</h3></div>
                </div>
            </div>
            <div class="col-md">
                <div class="card h-100 border-0 border-start border-4 border-info shadow-sm">
                    <div class="card-body"><small class="text-muted">Series</small><h3 id="cSeries" class="fw-semibold mb-0">0</h3></div>
                </div>
            </div>
            <div class="col-md">
                <div class="card h-100 border-0 border-start border-4 border-warning shadow-sm">
                    <div class="card-body"><small class="text-muted">Anime</small><h3 id="cAnime" class="fw-semibold mb-0">0</h3></div>
                </div>
            </div>
        </div>

        <!-- ===== TITLES TABLE ===== -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">

                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Titles</h4>
                    <div class="d-flex flex-wrap gap-2">
                        <input id="fTitle" class="form-control w-auto" placeholder="Search title" oninput="loadTitles()">
                        <select id="fType" class="form-select w-auto" onchange="loadTitles()">
                            <option value="">All types</option>
                            <option value="movie">Movies</option>
                            <option value="series">Series</option>
                            <option value="anime">Anime</option>
                        </select>
                        <select id="fGenre" class="form-select w-auto" onchange="loadTitles()">
                            <option value="">All genres</option>
                        </select>
                        <select id="fRating" class="form-select w-auto" onchange="loadTitles()">
                            <option value="">All ratings</option>
                            <option>PG</option>
                            <option>PG-13</option>
                            <option>R</option>
                            <option>R18</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Type</th>
                                <th>Genres</th>
                                <th>Rating</th>
                                <th>Score</th>
                                <th>Year</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        let genresBuilt = false;

        // "Sync Catalog" button: POST /api/catalog/sync pulls titles from the online APIs into data/catalog.json
        async function syncCatalog() {
            try {
                showMessage('Syncing... this can take a few seconds.', 'info');
                const r = await api('/api/catalog/sync', { method: 'POST' });
                const warn = r.warnings.length ? ` Warnings: ${r.warnings.join(' | ')}` : '';
                showMessage(`${r.message} ${r.count} titles (${r.added} new).${warn}`, r.warnings.length ? 'warning' : 'success');
                genresBuilt = false;
                await loadTitles();
            } catch (e) {
                showMessage(e.message);
            }
        }

        // fills the genre filter with the genres found in the saved catalog
        function buildGenres(data) {
            const genres = [...new Set(data.flatMap(t => t.genres))].sort();
            fGenre.innerHTML = '<option value="">All genres</option>' + genres.map(g => `<option>${esc(g)}</option>`).join('');
            genresBuilt = true;
        }

        // GET /api/catalog/search with the filters, then draws the table
        async function loadTitles() {
            try {
                const params = new URLSearchParams({ q: fTitle.value, type: fType.value, genre: fGenre.value, rating: fRating.value });
                const r = await api(`/api/catalog/search?${params}`);
                if (!genresBuilt && !fTitle.value && !fType.value && !fGenre.value && !fRating.value) buildGenres(r.data);

                cTotal.textContent = r.count;
                cMovie.textContent = r.data.filter(t => t.type === 'movie').length;
                cSeries.textContent = r.data.filter(t => t.type === 'series').length;
                cAnime.textContent = r.data.filter(t => t.type === 'anime').length;

                if (r.data.length === 0) {
                    rows.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No titles found. Click Sync Catalog to load some.</td></tr>';
                    return;
                }
                rows.innerHTML = r.data.map(t => {
                    const pic = t.posterUrl
                        ? `<img src="${esc(t.posterUrl)}" width="48" height="64" class="rounded object-fit-cover" onerror="this.style.visibility='hidden'">`
                        : `<div class="rounded bg-secondary-subtle" style="width:48px;height:64px"></div>`;
                    return `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    ${pic}
                                    <a href="title.html?source=${encodeURIComponent(t.source)}&id=${encodeURIComponent(t.id)}" class="fw-semibold text-decoration-none">${esc(t.title)}</a>
                                </div>
                            </td>
                            <td>${esc(t.type)}</td>
                            <td>${esc(t.genres.join(', '))}</td>
                            <td><span class="badge rounded-pill text-bg-secondary">${esc(t.ageRating ?? 'n/a')}</span></td>
                            <td>${esc(t.score ?? '-')}</td>
                            <td>${esc(t.year ?? '-')}</td>
                            <td><button class="btn btn-sm btn-primary" data-source="${esc(t.source)}" data-id="${esc(t.id)}" onclick="addToWatchlist(this.dataset.source, this.dataset.id)">Add</button></td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                showMessage(e.message);
            }
        }

        loadTitles();
    </script>
</body>
</html>
