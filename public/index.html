<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cine-Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/cinespace.css" rel="stylesheet">
</head>
<body>
    
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-semibold">🎬 Cine-Space</span>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-dark" onclick="openDice()">🎲 Surprise me</button>
                <a class="btn btn-dark" href="account.html">My Watchlist</a>
                <a class="btn btn-dark" href="login.html">Log in</a>
                <button class="btn btn-dark" onclick="logout()">Log out</button>
                <button class="btn btn-dark" onclick="syncCatalog()">Sync Catalog</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div id="message"></div>

        <div class="row g-3 mb-4">
            <div class="col-lg-8">
                <h2 class="h3 fw-semibold mb-1">Discover</h2>
                <p class="text-muted">Movies, series and anime synced from free online APIs.</p>

                <div class="d-flex flex-wrap gap-2">
                    <input id="fTitle" class="form-control w-auto" placeholder="Search title" oninput="loadTitles()">
                    <select id="fType" class="form-select w-auto" onchange="loadTitles()">
                        <option value="">All types</option>
                        <option value="movie">Movies</option>
                        <option value="series">Series</option>
                        <option value="anime">Anime</option>
                    </select>
                    <select id="fGenre" class="form-select w-auto" onchange="loadTitles()">
                        <option value="">All genres</option>
                    </select>
                    <select id="fRating" class="form-select w-auto" onchange="loadTitles()">
                        <option value="">All ratings</option>
                        <option>PG</option>
                        <option>PG-13</option>
                        <option>R</option>
                        <option>R18</option>
                    </select>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card dice-card h-100">
                    <div class="card-body">
                        <h5>Can't decide?</h5>
                        <p>Let the dice pick something to watch.</p>
                        <button class="btn" onclick="openDice()">🎲 Roll the dice</button>
                    </div>
                </div>
            </div>
        </div>

        <p id="count" class="text-muted small"></p>
        <div id="grid" class="poster-grid"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
        let genresBuilt = false;

        // "Sync Catalog": POST /api/catalog/sync pulls titles from the online APIs into data/catalog.json
        async function syncCatalog() {
            try {
                showMessage('Syncing... this can take a few seconds.', 'info');
                const r = await api('/api/catalog/sync', { method: 'POST' });
                const warn = r.warnings.length ? ` Warnings: ${r.warnings.join(' | ')}` : '';
                showMessage(`${r.message} ${r.count} titles (${r.added} new).${warn}`, r.warnings.length ? 'warning' : 'success');
                genresBuilt = false;
                await loadTitles();
            } catch (e) {
                showMessage(e.message);
            }
        }

        function buildGenres(data) {
            const genres = [...new Set(data.flatMap(t => t.genres))].sort();
            fGenre.innerHTML = '<option value="">All genres</option>' + genres.map(g => `<option>${esc(g)}</option>`).join('');
            genresBuilt = true;
        }

        // GET /api/catalog/search with the filters, then draws one poster card per title
        async function loadTitles() {
            try {
                const params = new URLSearchParams({ q: fTitle.value, type: fType.value, genre: fGenre.value, rating: fRating.value });
                const r = await api(`/api/catalog/search?${params}`);
                if (!genresBuilt && !fTitle.value && !fType.value && !fGenre.value && !fRating.value) buildGenres(r.data);

                count.textContent = `${r.count} titles`;
                grid.innerHTML = r.data.map(posterCard).join('') || '<p class="text-muted">No titles found. Click Sync Catalog to load some.</p>';
            } catch (e) {
                showMessage(e.message);
            }
        }

        loadTitles();
    </script>
</body>
</html>
