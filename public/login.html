<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cine-Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-4">
        <h1>Cine-Space</h1>
        <div id="message"></div>

        <h2>Log in</h2>
        <form id="loginForm">
            <input id="loginUser" placeholder="Username" required>
            <input id="loginPass" type="password" placeholder="Password" required>
            <button>Log in</button>
        </form>

        <h2>Register</h2>
        <form id="registerForm">
            <input id="regUser" placeholder="Username" required>
            <input id="regPass" type="password" placeholder="Password" required>
            <button>Create account</button>
        </form>
    </main>

    <script src="js/app.js"></script>
    <script>
        async function submitAuth(path, username, password) {
            try {
                const r = await api(`/api/auth/${path}`, { method: 'POST', body: JSON.stringify({ username, password }) });
                localStorage.setItem(TOKEN_KEY, r.token);
                location.href = 'index.html';
            } catch (e) {
                showMessage(e.message);
            }
        }

        loginForm.addEventListener('submit', e => { e.preventDefault(); submitAuth('login', loginUser.value, loginPass.value); });
        registerForm.addEventListener('submit', e => { e.preventDefault(); submitAuth('register', regUser.value, regPass.value); });
    </script>
</body>
</html>
