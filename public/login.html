<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cine-Space | Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/cinespace.css" rel="stylesheet">
</head>
<body>
    <main class="container auth-card">
        <div class="card border-0 shadow-sm p-4">
            <h1 class="h3 fw-semibold text-center">🎬 Cine-Space</h1>
            <h2 class="h5 text-center text-muted mb-3">Log in</h2>
            <div id="message"></div>
            <form id="loginForm">
                <input id="loginUser" class="form-control mb-2" placeholder="Username" required>
                <input id="loginPass" type="password" class="form-control mb-3" placeholder="Password" required>
                <button class="btn btn-primary w-100">Log in</button>
            </form>
            <p class="mt-3 mb-0 text-center">No account yet? <a href="signup.html">Sign up</a></p>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        // signup.html sends people here with ?registered=1
        if (new URLSearchParams(location.search).get('registered')) showMessage('Account created. Please log in.', 'success');

        loginForm.addEventListener('submit', async e => {
            e.preventDefault();
            try {
                const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: loginUser.value, password: loginPass.value }) });
                localStorage.setItem(TOKEN_KEY, r.token);
                location.href = 'index.html';
            } catch (err) {
                showMessage(err.message);
            }
        });
    </script>
</body>
</html>
