<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cine-Space | Sign up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/cinespace.css" rel="stylesheet">
</head>
<body>
    <main class="container auth-card">
        <div class="card border-0 shadow-sm p-4">
            <h1 class="h3 fw-semibold text-center">🎬 Cine-Space</h1>
            <h2 class="h5 text-center text-muted mb-3">Sign up</h2>
            <div id="message"></div>
            <form id="signupForm">
                <input id="sUser" class="form-control mb-2" placeholder="Username" required>
                <input id="sPass" type="password" class="form-control mb-2" placeholder="Password" required>
                <input id="sPass2" type="password" class="form-control mb-1" placeholder="Confirm password" required>
            <div class="form-text mb-3">At least 6 characters, with a number and a special character (like ! or @).</div>
                <button class="btn btn-primary w-100">Create account</button>
            </form>
            <p class="mt-3 mb-0 text-center">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        // after signing up, go back to the login page so the new user has to log in
        signupForm.addEventListener('submit', async e => {
            e.preventDefault();
            if (sPass.value !== sPass2.value) return showMessage('Passwords do not match.');
            try {
                await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ username: sUser.value, password: sPass.value }) });
                location.href = 'login.html?registered=1';
            } catch (err) {
                showMessage(err.message);
            }
        });
    </script>
</body>
</html>
