<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cine-Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="container pt-3">
        <a href="index.html">Home</a> |
        <a href="account.html">My Watchlist</a> |
        <a href="login.html">Log in</a> |
        <a href="#" onclick="logout()">Log out</a>
    </nav>
    <main class="container py-4">
        <div id="message"></div>
        <div id="detail"></div>
        <button onclick="addToWatchlist(source, id)">Add to watchlist</button>

        <h3>Similar titles</h3>
        <div id="similar"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const source = params.get('source');
        const id = params.get('id');

        // GET /api/catalog/:source/:id  and  /api/catalog/:source/:id/similar
        async function loadTitle() {
            try {
                const t = (await api(`/api/catalog/${source}/${id}`)).data;
                detail.innerHTML = `
                    <h1>${esc(t.title)}</h1>
                    <p>Type: ${esc(t.type)} | Age rating: ${esc(t.ageRating ?? 'n/a')} | Score: ${esc(t.score ?? 'n/a')}</p>
                    <p>${t.type === 'movie' ? `Length: ${esc(t.lengthMinutes ?? 'n/a')} minutes` : `Episodes: ${esc(t.episodes ?? 'n/a')}`}</p>
                    <p>By: ${esc((t.creators || []).join(', ') || 'n/a')}</p>
                    <p>${esc(t.synopsis)}</p>
                    <h3>Where to watch</h3>
                    <ul>${(t.watchLinks || []).map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a> (${esc(l.price)})</li>`).join('') || '<li>No links yet.</li>'}</ul>
                `;
                const s = (await api(`/api/catalog/${source}/${id}/similar`)).data;
                similar.innerHTML = s.map(x => `<div><a href="title.html?source=${encodeURIComponent(x.source)}&id=${encodeURIComponent(x.id)}">${esc(x.title)}</a></div>`).join('') || 'None found.';
            } catch (e) {
                showMessage(e.message);
            }
        }

        loadTitle();
    </script>
</body>
</html>
