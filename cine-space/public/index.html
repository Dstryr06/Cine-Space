<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cine-Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="container pt-3">
        <a href="index.html">Home</a> |
        <a href="account.html">My Watchlist</a> |
        <a href="login.html">Log in</a> |
        <a href="#" onclick="logout()">Log out</a>
    </nav>
    <main class="container py-4">
        <h1>Cine-Space</h1>
        <div id="message"></div>

        <!-- filters: title, type, genre, age rating -->
        <form id="filters">
            <input id="fTitle" placeholder="Search title">
            <select id="fType">
                <option value="">All types</option>
                <option value="movie">Movies</option>
                <option value="series">Series</option>
                <option value="anime">Anime</option>
            </select>
            <select id="fGenre">
                <option value="">All genres</option>
                <option>Action</option>
                <option>Comedy</option>
                <option>Drama</option>
                <option>Fantasy</option>
                <option>Horror</option>
                <option>Romance</option>
                <option>Sci-Fi</option>
            </select>
            <select id="fRating">
                <option value="">All ratings</option>
                <option>PG</option>
                <option>PG-13</option>
                <option>R</option>
                <option>R18</option>
            </select>
            <button>Search</button>
        </form>

        <div id="results"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
        // GET /api/catalog/search with the filters; each result links to its own page
        async function loadTitles() {
            try {
                const params = new URLSearchParams({ q: fTitle.value, type: fType.value, genre: fGenre.value, rating: fRating.value });
                const r = await api(`/api/catalog/search?${params}`);
                results.innerHTML = r.data.map(t => `
                    <div class="py-2">
                        <a href="title.html?source=${encodeURIComponent(t.source)}&id=${encodeURIComponent(t.id)}"><strong>${esc(t.title)}</strong></a>
                        (${esc(t.type)}, ${esc(t.year ?? '')}) ${esc(t.genres.join(', '))}
                        <button data-source="${esc(t.source)}" data-id="${esc(t.id)}" onclick="addToWatchlist(this.dataset.source, this.dataset.id)">Add to watchlist</button>
                    </div>
                `).join('') || 'No titles found.';
            } catch (e) {
                showMessage(e.message);
            }
        }

        filters.addEventListener('submit', e => { e.preventDefault(); loadTitles(); });
        loadTitles();
    </script>
</body>
</html>
